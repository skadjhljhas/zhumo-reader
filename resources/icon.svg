<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="朱墨：一枚朱印，与它落在墨海上的光">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2=".18" y2="1"><stop offset="0" stop-color="#0b1730"/><stop offset=".55" stop-color="#11284a"/><stop offset="1" stop-color="#1b4568"/></linearGradient>
    <radialGradient id="air" cx=".80" cy=".06" r=".95"><stop stop-color="#a7cdff" stop-opacity=".22"/><stop offset=".5" stop-color="#5c8fc9" stop-opacity=".05"/><stop offset="1" stop-color="#1b4568" stop-opacity="0"/></radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6e7ff" stop-opacity=".45"/><stop offset=".5" stop-color="#7f9fc8" stop-opacity=".10"/><stop offset="1" stop-color="#9ab6dc" stop-opacity=".30"/></linearGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff9d7c"/><stop offset=".55" stop-color="#e9553f"/><stop offset="1" stop-color="#c0372f"/></linearGradient>
    <linearGradient id="column" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe3ba" stop-opacity=".95"/><stop offset=".22" stop-color="#f7ead8" stop-opacity=".80"/><stop offset=".55" stop-color="#d8e9ff" stop-opacity=".46"/><stop offset="1" stop-color="#bcd6ff" stop-opacity="0"/></linearGradient>
    <filter id="tiny" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5"/></filter>
    <filter id="soft" x="-100%" y="-30%" width="300%" height="160%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="wide" x="-100%" y="-50%" width="300%" height="200%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="vast" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="46"/></filter>
    <clipPath id="tile"><rect x="24" y="24" width="464" height="464" rx="112"/></clipPath>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#ink)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#air)"/>
